<line x1="232" y1="406" x2="620" y2="406" stroke="#111" stroke-width="3"/><line x1="232" y1="412" x2="620" y2="412" stroke="#111" stroke-width="3"/><text x="628" y="414" font-size="12.5" font-weight="bold" fill="#111">the cut</text>
<text x="36" y="660" font-size="12" fill="#333">The item is taken at once and the watermark is fixed at the request: the summary computation runs</text>
<text x="36" y="679" font-size="12" fill="#333">afterwards and cannot move the line. Arc 2 does not fit the arc threshold, so its bound is its live</text>
<text x="36" y="698" font-size="12" fill="#333">boundary — the cut lands just under its round-1 reply, the last response it had when the request</text>
<text x="36" y="717" font-size="12" fill="#333">was written. The rounds arc 2 takes afterwards, on the transcript it started with, all land below</text>
<text x="36" y="736" font-size="12" fill="#333">the cut. Crossing the hard budget made the run suspend; the resume reads the summary, a note</text>
<text x="36" y="755" font-size="12" fill="#333">standing at the cut, and the surviving part as a skeleton: its opening request verbatim, tool</text>
<text x="36" y="774" font-size="12" fill="#333">calls without results. The request survives the cut; once covered, it is discarded on read.</text>
