<text x="646" y="450" font-size="12.5" font-weight="bold" fill="#111">the cut</text>
<text x="36" y="642" font-size="12" fill="#333">Arc 2 does not fit the arc threshold, so bound(arc 2) = its live boundary. The rounds above the cut</text>
<text x="36" y="661" font-size="12" fill="#333">are summarised with everything else; the reply below the cut is live material. The next turn reads the</text>
<text x="36" y="680" font-size="12" fill="#333">summary, a note standing at the cut, and the arc's surviving part — rendered as a skeleton, tool</text>
<text x="36" y="699" font-size="12" fill="#333">calls without results. Crossing the hard budget made the run write ARC_SUSPENDED and stop.</text>
