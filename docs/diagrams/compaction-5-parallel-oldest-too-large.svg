<text x="900" y="154.0" font-size="12.5" fill="#475569">arc 1, closed</text>
<line x1="232" y1="526" x2="926" y2="526" stroke="#111" stroke-width="3"/><line x1="232" y1="532" x2="926" y2="532" stroke="#111" stroke-width="3"/><text x="934" y="534" font-size="12.5" font-weight="bold" fill="#111">the cut</text>
<text x="36" y="740" font-size="12" fill="#333">The request is a want, not a snapshot: the compactor computes against the log as it stands when</text>
<text x="36" y="759" font-size="12" fill="#333">it takes the item, here after A's suspension, so it knows the rounds written after the request, and</text>
<text x="36" y="778" font-size="12" fill="#333">the cut passes through A's spent prefix, in A's column alone; the request itself falls below the</text>
<text x="36" y="797" font-size="12" fill="#333">cut and is discarded on read once covered. A is over the arc threshold, so it contributes its live</text>
<text x="36" y="816" font-size="12" fill="#333">boundary; B, small, its opening; the cut is the min. B opens with the context still past the hard</text>
<text x="36" y="835" font-size="12" fill="#333">line, so the admission check suspends B right away: its estimate is over the higher budget while</text>
<text x="36" y="854" font-size="12" fill="#333">the request stands, and it never runs — unless B's projection elides A's material entirely, in</text>
<text x="36" y="873" font-size="12" fill="#333">which case its estimate is low and it runs. The completion scan requeues both once the COMPACTED</text>
<text x="36" y="892" font-size="12" fill="#333">lands: A reads summary, note and skeleton; B the summary plus its own whole log.</text>
