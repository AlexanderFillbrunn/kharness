<line x1="232" y1="522" x2="640" y2="522" stroke="#111" stroke-width="3"/>
<line x1="232" y1="528" x2="640" y2="528" stroke="#111" stroke-width="3"/>
<text x="646" y="530" font-size="12.5" font-weight="bold" fill="#111">the cut</text>
<text x="36" y="682" font-size="12" fill="#333">Arc A is over the arc threshold, so it contributes its live boundary to the min; arc B, opened later</text>
<text x="36" y="701" font-size="12" fill="#333">and small, contributes its opening. The cut is min(live boundary of A, opening of B) - 1: the line</text>
<text x="36" y="720" font-size="12" fill="#333">passes through A's spent prefix — the summary covers its earlier rounds, the reply and suspension</text>
<text x="36" y="739" font-size="12" fill="#333">below the cut stay verbatim, and A's next turn reads summary, a note at the cut and a skeleton —</text>
<text x="36" y="758" font-size="12" fill="#333">while B is entirely below the cut and reads the summary plus its own whole log. B's bound can never</text>
<text x="36" y="777" font-size="12" fill="#333">push the cut past A's live material: a fitting younger arc may only pull the line earlier, never</text>
<text x="36" y="796" font-size="12" fill="#333">into an open arc's live part.</text>
