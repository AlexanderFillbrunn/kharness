<text x="900" y="154.0" font-size="12.5" fill="#475569">arc 1, closed</text>
<line x1="232" y1="526" x2="926" y2="526" stroke="#111" stroke-width="3"/><line x1="232" y1="532" x2="926" y2="532" stroke="#111" stroke-width="3"/><text x="934" y="534" font-size="12.5" font-weight="bold" fill="#111">the cut</text>
<text x="36" y="700" font-size="12" fill="#333">Arc A is over the arc threshold, so it contributes its live boundary to the min; arc B, opened</text>
<text x="36" y="719" font-size="12" fill="#333">later and small, contributes its opening. The cut is min(live boundary of A, opening of B) - 1:</text>
<text x="36" y="738" font-size="12" fill="#333">the step curve crossed the hard budget in A's last round, so A suspends, and the cut passes</text>
<text x="36" y="757" font-size="12" fill="#333">through A's spent prefix, in A's column alone; the shared blocks it crosses were in both runs'</text>
<text x="36" y="776" font-size="12" fill="#333">transcripts anyway. The reply and suspension below the cut stay verbatim: A's next turn reads</text>
<text x="36" y="795" font-size="12" fill="#333">summary, a note at the cut and a skeleton; B is entirely below the cut and reads the summary plus</text>
<text x="36" y="814" font-size="12" fill="#333">its own whole log. A fitting younger arc may only pull the line earlier, never into an open arc's</text>
<text x="36" y="833" font-size="12" fill="#333">live part.</text>
