<text x="36" y="30" font-size="17" font-weight="bold" fill="#111">5. Parallel open arcs, the oldest too large to keep whole</text>
<text x="36" y="52" font-size="12.5" fill="#555">bound(arc A) = its live boundary, bound(arc B) = its opening; the min passes the line through A and keeps B whole</text>
<text x="250" y="56" font-size="11.5" fill="#888">a solid block spanning both columns is an event both runs read; a dashed block is a session record of the fold</text>
<text x="250" y="82" font-size="12.5" font-weight="bold" fill="#4c1d95">run of arc A (open, spans the cut)</text>
