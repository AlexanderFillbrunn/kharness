<rect x="250" y="416" width="330" height="28" rx="3" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/><text x="260" y="435" font-size="12" fill="#222">COMPACTION_REQUESTED</text>
<rect x="250" y="456" width="330" height="28" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/><text x="260" y="475" font-size="12" fill="#222">tool call</text>
