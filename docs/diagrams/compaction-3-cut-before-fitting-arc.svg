<text x="36" y="30" font-size="17" font-weight="bold" fill="#111">3. The cut before an arc whose own log fits the threshold</text>
<text x="36" y="52" font-size="12.5" fill="#555">the prefix, not arc 2, crosses the soft budget; the opening bound keeps the arc whole, and the summary never covers</text>
<text x="36" y="68" font-size="12.5" fill="#555">its log</text>
