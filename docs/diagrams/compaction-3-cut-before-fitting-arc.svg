<path d="M 594 218 H 600 M 594 562 H 600" stroke="#64748b" stroke-width="2" fill="none"/>
<text x="610" y="394.0" font-size="12.5" fill="#475569">arc 2, still open, fits the arc threshold</text>
<line x1="232" y1="206" x2="620" y2="206" stroke="#111" stroke-width="3"/><line x1="232" y1="212" x2="620" y2="212" stroke="#111" stroke-width="3"/><text x="628" y="214" font-size="12.5" font-weight="bold" fill="#111">the cut</text>
<text x="36" y="620" font-size="12" fill="#333">Arc 2's own log fits the arc threshold, so bound(arc 2) = its opening and the cut is drawn before</text>
<text x="36" y="639" font-size="12" fill="#333">the arc. Nothing of arc 2 was summarised: its next transcript is the summary plus its own whole log,</text>
<text x="36" y="658" font-size="12" fill="#333">in full, with no note inside it. Arc 1's material is replaced by the summary and never reappears.</text>
<text x="36" y="677" font-size="12" fill="#333">The run was in flight when the watermark was computed and never crossed the hard budget, so it kept</text>
<text x="36" y="696" font-size="12" fill="#333">the transcript it started with; the cut takes effect from its next turn.</text>
<rect x="36" y="719" width="14" height="14" rx="2" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="55" y="730" font-size="11" fill="#444">user msg</text>
