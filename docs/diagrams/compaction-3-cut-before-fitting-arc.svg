<rect x="250" y="536" width="330" height="28" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.2"/><text x="260" y="555" font-size="12" fill="#222">agent reply</text>
<path d="M 215 430 H 245" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
<path d="M 600 98 V 202" stroke="#64748b" stroke-width="2" fill="none"/>
