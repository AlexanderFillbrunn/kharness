<text x="646" y="210" font-size="12.5" font-weight="bold" fill="#111">the cut</text>
<text x="36" y="602" font-size="12" fill="#333">Arc 2's own log fits the arc threshold, so bound(arc 2) = its opening and the cut is drawn before</text>
<text x="36" y="621" font-size="12" fill="#333">the arc. Nothing of arc 2 was summarised: its next transcript is the summary plus its own whole log,</text>
<text x="36" y="640" font-size="12" fill="#333">in full, with no note inside it. Arc 1's material is replaced by the summary and never reappears.</text>
<text x="36" y="659" font-size="12" fill="#333">The run was in flight when the watermark was computed and never crossed the hard budget, so it</text>
<text x="36" y="678" font-size="12" fill="#333">kept the transcript it started with; the cut takes effect from its next turn.</text>
