<text x="646" y="370" font-size="12.5" font-weight="bold" fill="#111">the cut</text>
<text x="36" y="482" font-size="12" fill="#333">The soft budget was crossed during arc 1, which closed before the compaction computed its watermark,</text>
<text x="36" y="501" font-size="12" fill="#333">so it constrains nothing and is summarised whole. Both open arcs fit their threshold, so each bound is</text>
<text x="36" y="520" font-size="12" fill="#333">its opening and the min puts the cut before arc 2, the oldest of them. Arc 2 and arc 3 are both kept</text>
<text x="36" y="539" font-size="12" fill="#333">whole below the cut: their next turns read the summary plus their own full logs, with no note, no</text>
<text x="36" y="558" font-size="12" fill="#333">skeleton, and no duplication between summary and transcript.</text>
