<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 692" width="1120" font-family="ui-monospace, Menlo, Consolas, monospace">
<rect width="100%" height="100%" fill="white"/>
<text x="36" y="30" font-size="17" font-weight="bold" fill="#111">4. Parallel open arcs that all fit the threshold</text>
<text x="36" y="52" font-size="12.5" fill="#555">both open arcs contribute their openings to the min; the cut lands before the oldest of them, and every open arc is</text>
<text x="36" y="68" font-size="12.5" fill="#555">kept whole</text>
<text x="250" y="56" font-size="11.5" fill="#888">a solid block spanning both columns is an event both runs read; a dashed block is a session record of the fold</text>
<text x="250" y="82" font-size="12.5" font-weight="bold" fill="#4c1d95">run of arc 2 (open, unworked)</text>
<rect x="250" y="96" width="300" height="348" fill="#fbfaff" stroke="#e9e4f8"/>
<text x="586" y="82" font-size="12.5" font-weight="bold" fill="#4c1d95">run of arc 3 (task-triggered, open)</text>
<rect x="586" y="96" width="300" height="348" fill="#fbfaff" stroke="#e9e4f8"/>
<text x="36" y="86" font-size="12" fill="#555">context</text>
<rect x="40" y="90" width="168" height="350" fill="#fafafa" stroke="#ccc"/>
<line x1="141.8" y1="90" x2="141.8" y2="440" stroke="#d97706" stroke-width="2" stroke-dasharray="5,4"/>
<line x1="187.6" y1="90" x2="187.6" y2="440" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4"/>
<text x="137.8" y="84" font-size="11.5" fill="#b45309" text-anchor="end">soft</text>
<text x="191.6" y="84" font-size="11.5" fill="#b91c1c">hard</text>
<polyline points="60.6,110.0 60.6,150.0 69.9,150.0 69.9,190.0 83.2,190.0 83.2,230.0 123.1,230.0 123.1,270.0 140.4,270.0 140.4,310.0 141.7,310.0 141.7,350.0 143.1,350.0 143.1,390.0 144.4,390.0 144.4,430.0 145.7,430.0" fill="none" stroke="#0f766e" stroke-width="2.5"/>
<rect x="137.8" y="266.0" width="8" height="8" fill="#d97706"/>
<rect x="250" y="96" width="636" height="28" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="260" y="115" font-size="12" fill="#222">USER_MESSAGE</text>
<rect x="250" y="136" width="636" height="28" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.2"/><text x="260" y="155" font-size="12" fill="#222">agent reply</text>
<rect x="250" y="176" width="636" height="28" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/><text x="260" y="195" font-size="12" fill="#222">tool call</text>
<rect x="250" y="216" width="636" height="28" rx="3" fill="#fef9c7" stroke="#a16207" stroke-width="1.2"/><text x="260" y="235" font-size="12" fill="#222">tool result</text>
<rect x="250" y="256" width="636" height="28" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.2"/><text x="260" y="275" font-size="12" fill="#222">agent reply</text>
<rect x="250" y="296" width="636" height="28" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/><text x="260" y="315" font-size="12" fill="#222">ARC_CLOSED</text>
<rect x="250" y="336" width="636" height="28" rx="3" fill="#fffbeb" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="6,4"/><text x="260" y="355" font-size="12" fill="#222">COMPACTION_REQUESTED</text>
<rect x="250" y="376" width="300" height="28" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="260" y="395" font-size="12" fill="#222">USER_MESSAGE</text>
<rect x="586" y="416" width="300" height="28" rx="3" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.2"/><text x="596" y="435" font-size="12" fill="#222">task event (X)</text>
<path d="M 894 98 V 322" stroke="#64748b" stroke-width="2" fill="none"/>
<path d="M 888 98 H 894 M 888 322 H 894" stroke="#64748b" stroke-width="2" fill="none"/>
<text x="900" y="214.0" font-size="12.5" fill="#475569">arc 1, closed</text>
<line x1="232" y1="366" x2="926" y2="366" stroke="#111" stroke-width="3"/><line x1="232" y1="372" x2="926" y2="372" stroke="#111" stroke-width="3"/><text x="934" y="374" font-size="12.5" font-weight="bold" fill="#111">the cut</text>
<text x="36" y="500" font-size="12" fill="#333">The soft budget was crossed during arc 1, which closed before the compaction computed its watermark,</text>
<text x="36" y="519" font-size="12" fill="#333">so it constrains nothing and is summarised whole: its blocks span both columns because both runs</text>
<text x="36" y="538" font-size="12" fill="#333">read them — the request spans with arc 1's record, dashed: arc 1's final check wrote it before</text>
<text x="36" y="557" font-size="12" fill="#333">either arc opened, and a dashed border marks it a session record, one the machine reads and no</text>
<text x="36" y="576" font-size="12" fill="#333">transcript shows. Both open arcs fit their</text>
<text x="36" y="595" font-size="12" fill="#333">threshold, so each bound is its opening and the min puts the cut before arc 2, the oldest of them.</text>
<text x="36" y="614" font-size="12" fill="#333">Arc 2 and arc 3 are both kept whole below the cut: their next turns read the summary plus their</text>
<text x="36" y="633" font-size="12" fill="#333">own full logs, with no note, no skeleton, and no duplication between summary and transcript.</text>
<rect x="36" y="656" width="14" height="14" rx="2" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="55" y="667" font-size="11" fill="#444">user msg</text>
<rect x="116" y="656" width="14" height="14" rx="2" fill="#e2e8f0" stroke="#334155"/>
<text x="135" y="667" font-size="11" fill="#444">agent reply</text>
<rect x="217" y="656" width="14" height="14" rx="2" fill="#fde68a" stroke="#b45309"/>
<text x="236" y="667" font-size="11" fill="#444">tool call</text>
<rect x="304" y="656" width="14" height="14" rx="2" fill="#fef9c7" stroke="#a16207"/>
<text x="323" y="667" font-size="11" fill="#444">tool result</text>
<rect x="405" y="656" width="14" height="14" rx="2" fill="#dcfce7" stroke="#15803d"/>
<text x="424" y="667" font-size="11" fill="#444">arc closes</text>
<rect x="499" y="656" width="14" height="14" rx="2" fill="#fff7ed" stroke="#c2410c"/>
<text x="518" y="667" font-size="11" fill="#444">request</text>
<rect x="572" y="656" width="14" height="14" rx="2" fill="#fee2e2" stroke="#b91c1c"/>
<text x="591" y="667" font-size="11" fill="#444">suspend</text>
<rect x="645" y="656" width="14" height="14" rx="2" fill="#ede9fe" stroke="#6d28d9"/>
<text x="664" y="667" font-size="11" fill="#444">task event</text>
<rect x="739" y="656" width="14" height="14" rx="2" fill="#fffbeb" stroke="#c2410c"/>
<text x="758" y="667" font-size="11" fill="#444">request (session, dashed)</text>
<rect x="938" y="662" width="20" height="4" fill="#111"/>
<text x="963" y="667" font-size="11" fill="#444">the cut / watermark</text>
<line x1="1103" y1="663" x2="1123" y2="663" stroke="#0f766e" stroke-width="2.5"/>
<text x="1128" y="667" font-size="11" fill="#444">context estimate, one step per event</text></svg>
